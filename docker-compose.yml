version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: elmansheya_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-elmansheya}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-elmansheya_secret_dev}
      POSTGRES_DB: ${POSTGRES_DB:-elmansheya_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./Backend/go-api/migrations/000001_initial_schema.up.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elmansheya -d elmansheya_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: elmansheya_redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
